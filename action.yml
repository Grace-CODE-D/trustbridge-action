name: 'TrustBridge Action'
description: >-
  Verify that a Stellar account is funded, holds a trustline for a specified
  asset (default USDC), and meets the minimum XLM reserve before continuing
  GitHub issue workflows.
author: 'Stellar-TrustBridge'

branding:
  icon: 'shield'
  color: 'blue'

# Breaking-change policy for inputs and outputs: docs/BREAKING_CHANGES.md
inputs:
  max_retries:
    description: "Maximum number of retry attempts for Horizon API requests"
    required: false
    default: "3"
  retry_base_delay_ms:
    description: "Base delay in milliseconds for exponential backoff"
    required: false
    default: "1000"
  horizon_url:
    description: 'Stellar Horizon API base URL'
    required: false
    default: 'https://horizon.stellar.org'
  asset_code:
    description: 'Asset code to check trustline for'
    required: false
    default: 'USDC'
  asset_issuer:
    description: 'Asset issuer Stellar address (G-address)'
    required: false
    default: 'GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN'
  min_xlm_reserve:
    description: 'Minimum native XLM balance required (string, e.g. 1.5)'
    required: false
    default: '1.5'
  min_trustline_limit:
    description: >-
      Minimum trustline limit required for the configured asset (numeric, e.g. 100).
      When set, the action will warn or fail if the account's trustline limit is below
      this threshold. Leave empty to skip this check. (Issue #140)
    required: false
    default: ''
  stellar_address_input:
    description: >-
      Stellar account address (G-address) to validate. Required unless
      assignee_address_map is set, in which case the address is resolved
      from the map using the GitHub assignee login.
    required: false
    default: ''
  assignee_address_map:
    description: >-
      Optional JSON object (or path to a JSON file) mapping GitHub usernames
      (assignees) to Stellar G-addresses. When set, TrustBridge resolves the
      assignee login from the GitHub event context and looks up their address
      before calling Horizon — so assignment workflows do not need to parse
      the issue body. Example: '{"alice":"G...","bob":"G..."}' or
      'rosters/wallets.json'. Do not commit private rosters to public repos;
      prefer org/repo secrets or a private path.
    required: false
    default: ''
  fail_on_missing:
    description: 'Fail the workflow step when checks do not pass (true) or only warn (false)'
    required: false
    default: 'true'
  debug_mode:
    description: 'Enable extra action logs for troubleshooting'
    required: false
    default: 'false'
  horizon_timeout_ms:
    description: 'Horizon request timeout in milliseconds (1000-60000)'
    required: false
    default: '15000'
  sticky_comment:
    description: >-
      Update TrustBridge's previous comment on the issue instead of posting a
      new one each run (true), or always post a new comment (false)
    required: false
    default: 'true'
  wait_until_funded:
    description: >-
      Poll Horizon until the account becomes funded (true) instead of
      immediately returning an unfunded result on the first 404 (false)
    required: false
    default: 'false'
  wait_until_funded_timeout_ms:
    description: >-
      Maximum total time to poll for the account to become funded, in
      milliseconds (0-600000). Only used when wait_until_funded is true.
    required: false
    default: '120000'
  wait_until_funded_interval_ms:
    description: >-
      Delay between funded-account polling attempts, in milliseconds
      (1000-60000). Only used when wait_until_funded is true.
    required: false
    default: '5000'
  horizon_url_fallback:
    description: >-
      Optional fallback Horizon API base URL. When the primary Horizon URL
      fails with a non-404 retryable error, the action transparently retries
      against this URL before giving up. Useful for cross-region or
      multi-provider resilience.
    required: false
    default: ''
  horizon_cache_ttl_ms:
    description: >-
      Time-to-live for the in-memory Horizon account cache, in milliseconds.
      Set to 0 to disable caching entirely. Default 60000 (60 seconds).
    required: false
    default: '60000'
  rpc_fallback_url:
    description: 'Optional secondary/fallback Horizon or RPC URL if primary fails'
    required: false
    default: ''
  horizon_max_requests:
    description: 'Global cap on Horizon requests per run to prevent 429 stampedes (0 for unlimited)'
    required: false
    default: '0'
  retry_max_delay_ms:
    description: 'Maximum backoff delay in milliseconds for Horizon retries'
    required: false
    default: '30000'
  use_cache:
    description: 'Cache successful Horizon responses in job memory (true/false)'
    required: false
    default: 'false'
  allow_cross_network_fallback:
    description: >-
      By default, the fallback URL (`horizon_url_fallback`/`rpc_fallback_url`)
      is only used when it resolves to the same Stellar network (public vs
      testnet, inferred from the URL) as `horizon_url` — a G-address is valid
      on every network, so a mismatched fallback could otherwise silently
      return funded/trustline/reserve data for the wrong ledger. Set this to
      `true` to opt into cross-network fallback anyway. Defaults to false.
    required: false
    default: 'false'
  log_inputs:
    description: >-
      Emit a structured JSON log record of all resolved action inputs at run
      start (redacted — Stellar addresses, Horizon URLs, and any embedded
      secrets are masked before the record is written to GitHub Actions log
      output). Useful for auditing which inputs were active during a run.
      Defaults to false.
    required: false
    default: 'false'
  trustbridge_config_path:
    description: >-
      Path (relative to the repository root, or absolute) to a consumer
      trustbridge.yml config file that can supply default values for
      horizon_url, asset_code, asset_issuer, min_xlm_reserve, and other
      inputs.  Explicit action inputs always override values from the file.
      The file is validated for SSRF-safe URLs, injection-clean strings, and
      secret field redaction before any value is used.  Defaults to
      ".trustbridge.yml" in the repository root.  Leave empty to skip the
      config file entirely.
    required: false
    default: '.trustbridge.yml'
  github_token:
    description: 'GitHub token used to post issue comments'
    required: true
  assets_json:
    description: >-
      JSON array of additional assets to validate trustlines for, e.g.
      [{"code":"USDC","issuer":"GA5Z..."},{"code":"EURC","issuer":"GCQT..."}].
      When provided, trustline checks are run for every listed asset in
      addition to (or instead of) the single asset_code/asset_issuer pair.
      Duplicate entries are silently deduplicated. Results are exposed via
      the `assets_trustline_status` and `trustlines_summary` outputs and
      rendered as a per-asset breakdown in the issue comment.
    required: false
    default: ''
  sep0007_deep_links:
    description: >-
      GitHub token used to post issue comments. Requires `issues: write`
      permission on the repository. `GITHUB_TOKEN` with `permissions:
      issues: write` is sufficient for issue-triggered runs on the default
      branch and on non-fork pull requests. For fork pull requests, org-level
      token restrictions, or GitHub Enterprise Server, you may need a
      fine-grained PAT or a GitHub App token with the Issues (read and write)
      permission. Omit or leave empty when running in a context where comment
      posting is not required (outputs are still set).
    required: true
  auto_wallet_labels:
    description: >-
      Automatically apply a wallet state label to the issue
      (wallet: funded | wallet: unfunded | wallet: trustline-missing |
      wallet: reserve-low | wallet: horizon-error). Requires
      `issues: write` permission. Default false.
    required: false
    default: 'false'
  sep0007_origin_domain:
    description: >-
      Optional origin domain embedded in SEP-0007 URIs for wallet validation
      (SEP-0007 §3.4). Leave empty to omit the field.
    required: false
    default: ''
  snooze_window_minutes:
    description: >-
      Time window (in minutes) to suppress duplicate validation failure comments
      on the same issue. When a check fails and the last check also failed
      within this window, the comment update is suppressed to reduce notification
      noise. Outputs are always updated even when snoozed. Set to 0 to disable
      snoozing (always post). Default 30 minutes. (Issue #155)
    required: false
    default: '30'
  force_comment:
    description: >-
      Bypass snooze logic and force an immediate comment post, even if within
      the snooze window. Useful for maintainers who want to re-alert after
      a fix attempt. Default false. (Issue #155)
    required: false
    default: 'false'
  home_domain_check_enabled:
    description: >-
      Enable the optional SEP-0001 home domain alignment check. When true,
      TrustBridge inspects the issuer account's on-chain `home_domain` field
      returned by Horizon and records the result in metrics. Off by default
      so existing USDC workflows are unaffected.
    required: false
    default: 'false'
  expected_home_domain:
    description: >-
      The domain string the issuer's on-chain `home_domain` must match
      (case-insensitive). Leave empty to only verify that *some* home domain
      is set (non-empty). Only used when `home_domain_check_enabled` is true.
      Example: "centre.io" for mainnet USDC.
    required: false
    default: ''
  home_domain_check_mode:
    description: >-
      Controls whether a home-domain failure blocks the overall result.
      "warn" (default) — adds an informational check row and emits metrics
      but does NOT fail the action. "strict" — a missing or mismatched home
      domain sets the check as failed and, when `fail_on_missing` is true,
      fails the workflow step. Only used when `home_domain_check_enabled`
      is true.
    required: false
    default: 'warn'

  # ---------------------------------------------------------------------------
  # Ledger lag / freshness guard (Issue #107)
  # ---------------------------------------------------------------------------
  check_ledger_freshness:
    description: >-
      When true, TrustBridge fetches the Horizon root endpoint before the
      account check and compares the latest ledger close time against the
      current wall clock. A lag beyond `max_ledger_lag_seconds` triggers a
      warning (or failure, see `ledger_freshness_fail_on_stale`). Off by
      default so existing USDC workflows are completely unaffected.
    required: false
    default: 'false'
  max_ledger_lag_seconds:
    description: >-
      Maximum allowed lag in seconds between Horizon's latest ledger close
      time and the current wall clock before the freshness guard fires.
      Defaults to 60 seconds (approximately 5–6 Stellar ledger close cycles
      at ~5–6 s each). Only used when `check_ledger_freshness` is true.
    required: false
    default: '60'
  ledger_freshness_fail_on_stale:
    description: >-
      When true, a stale ledger response (lag > max_ledger_lag_seconds) marks
      the check as failed. Combined with `fail_on_missing: true` this will
      fail the workflow step. When false (default), the stale result is
      informational only — a warning row appears in the checks table and
      metrics are emitted, but `valid` is unaffected. This lets maintainers
      observe lag before enforcing it. Only used when
      `check_ledger_freshness` is true.
    required: false
    default: 'false'

outputs:
  # ── Legacy outputs (kept for backward compatibility) ──────────────────────
  trustline_exists:
    description: 'Whether the account has a trustline for the configured asset'
  xlm_balance:
    description: 'Current native XLM balance as reported by Horizon'
  account_funded:
    description: 'Whether the account exists and is activated on the Stellar network'
  comment_url:
    description: 'URL of the created or updated issue comment, when run in an issue context'
  full_report_path:
    description: >-
      Absolute path of the full validation report file written to the workflow
      workspace when the comment body exceeded GitHub's size limit.  Empty
      when the comment was within the limit and no file was written.

runs:
  using: 'node20'
  main: 'dist/index.js'
