name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Test on every supported Node.js LTS version.
    # action.yml 'runs.using' stays node20 until GitHub ships a node22 GA
    # runner label — see README § "Node.js runtime support".
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    name: build-and-test (Node ${{ matrix.node }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Dedicated schema-sync check: fails fast with a clear message when
      # action.yml inputs drift from schemas/action-inputs.schema.json.
      - name: Verify action.yml ↔ schema sync
        run: npm test -- --testPathPattern action-schema-sync --no-coverage

      # Includes __tests__/validation.performance.test.ts (mocked Horizon p95 budget).
      - name: Test
        run: npm test

      - name: Verify comment golden snapshots and test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify action bundle exists
        run: test -f dist/index.js

      # Bundle size budget check — reports current size and fails if budget exceeded
      - name: Check bundle size budget
        run: npm test -- --testPathPattern bundle-size --no-coverage

      # Only check dist/ drift on the baseline node version that matches
      # action.yml 'runs.using: node20', to avoid false positives.
      - name: Verify dist/ matches src/
        if: matrix.node == '20'
        run: |
          npm run build
          if ! git diff --quiet --exit-code -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # ── Opt-in mock Horizon smoke tests ─────────────────────────────────────
  # This job runs the smoke test suite against a local WireMock container.
  # It is DISABLED in the default CI pipeline (if: false) to keep standard
  # CI fast and dependency-free.
  #
  # To enable:
  #   - Change `if: false` to `if: github.event_name == 'workflow_dispatch'`
  #     to run only on manual triggers, OR
  #   - Remove the `if:` condition entirely to always run alongside unit tests.
  #
  # See mock/horizon/README.md for full documentation.
  mock-horizon-smoke:
    runs-on: ubuntu-latest
    # Change or remove this condition to opt in:
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start mock Horizon container
        run: npm run mock:start

      - name: Run smoke tests against mock Horizon
        env:
          HORIZON_MOCK_URL: http://localhost:8089
        run: npm run test:mock

      - name: Stop mock Horizon container
        if: always()
        run: npm run mock:stop
