name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify comment golden snapshots and test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify action bundle exists
        run: test -f dist/index.js

      - name: Verify dist/ matches src/
        run: |
          if ! git diff --quiet --exit-code -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # Wave #20 — Horizon SSRF allowlist audit
  # Runs the dedicated ssrf_allowlist test suite in isolation so a regression
  # that weakens the block-list breaks the build independently of the main
  # test matrix. This step also serves as living documentation of every
  # blocked threat category (loopback, private IPs, cloud-metadata, etc.).
  ssrf-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Horizon SSRF allowlist audit
        run: npx ts-jest --testPathPattern="ssrf_allowlist" 2>/dev/null || npm test -- --testPathPattern="ssrf_allowlist" --no-coverage
