name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify comment golden snapshots and test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify action bundle exists
        run: test -f dist/index.js

      - name: Verify dist/ matches src/
        run: |
          if ! git diff --quiet --exit-code -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  # Wave #30: dry-run smoke tests validate comment_mode and dashboard_webhook_url
  dry-run-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dry-run smoke test
        uses: ./
        with:
          stellar_address_input: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
          horizon_url: "https://horizon.stellar.org"
          asset_code: "USDC"
          asset_issuer: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
          comment_mode: 'dry-run'
          fail_on_missing: false
