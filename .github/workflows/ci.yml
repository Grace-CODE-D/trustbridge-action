name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Includes __tests__/validation.performance.test.ts (mocked Horizon p95 budget).
      - name: Test
        run: npm test

      - name: Verify comment golden snapshots and test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify action bundle exists
        run: test -f dist/index.js

      - name: Verify dist/ matches src/
        run: |
          npm run build
          if ! git diff --quiet --exit-code -- dist; then
            echo "::error::dist/ is out of date with src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Verify dist/ build hash
        run: |
          BUILD_HASH=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum | awk '{print $1}')
          echo "build_hash=$BUILD_HASH" >> "$GITHUB_OUTPUT"
          echo "Build hash: $BUILD_HASH"
          if [ -f .dist_hash ]; then
            STORED_HASH=$(cat .dist_hash)
            if [ "$BUILD_HASH" != "$STORED_HASH" ]; then
              echo "::error::dist/ build hash does not match committed hash. Run 'npm run build' and commit the result."
              exit 1
            fi
          fi
