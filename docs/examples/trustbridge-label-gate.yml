# Example: TrustBridge with label gate
#
# This workflow demonstrates a simple label gate pattern. Wallet validation
# only runs when the issue has a specific label (e.g., "bounty" or "needs-wallet").
# When the gate is closed (no label present), validation is skipped entirely,
# reducing noise and unnecessary API calls.
#
# Use case: Gate bounty payouts behind an explicit "bounty" label so not every
# issue assignment triggers wallet checks.
#
# Copy this into `.github/workflows/trustbridge-label-gate.yml` in a consumer
# repository and adjust `gate_labels` and `stellar_address_input` to match your
# program.
#
# Permissions used: issues:read (for label checks), contents:read (optional, for config file)
# No issues:write needed unless you set post_skip_comment: true.

name: Verify Stellar wallet (with label gate)

on:
  issues:
    types: [assigned]
  workflow_dispatch:
    inputs:
      stellar_address:
        description: 'Stellar G-address to validate'
        required: true
      gate_labels:
        description: 'Comma-separated gate labels (e.g., bounty, needs-wallet)'
        required: false
        default: 'bounty'

jobs:
  trustbridge-gated:
    runs-on: ubuntu-latest
    permissions:
      # Minimal permissions: read labels for the gate check, read repo for optional config file.
      # No issues:write needed since post_skip_comment is false (default).
      issues: read
      contents: read
    steps:
      - name: Resolve Stellar address
        id: addr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.stellar_address }}" >> "$GITHUB_OUTPUT"
          else
            # Example: hardcoded address. In practice, extract from issue body or use assignee_address_map.
            # See docs/USAGE.md for address extraction patterns.
            echo "value=GYOURCONTRIBUTORADDRESSHERE" >> "$GITHUB_OUTPUT"
          fi

      - name: TrustBridge with label gate
        id: gate
        # Check out the repo if using a shared composite action from a branch
        # (not required if using the repo's own .github/actions).
        uses: Stellar-TrustBridge/trustbridge-action/.github/actions/trustbridge-label-gate@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stellar_address_input: ${{ steps.addr.outputs.value }}
          gate_labels: ${{ github.event.inputs.gate_labels || 'bounty,needs-wallet' }}
          post_skip_comment: 'false'  # don't post a comment when gate is closed
          fail_on_missing: 'true'     # hard-fail when validation checks don't pass

      - name: Log gate status
        run: |
          echo "Gate skipped: ${{ steps.gate.outputs.gate_skipped }}"
          if [ "${{ steps.gate.outputs.gate_skipped }}" = "true" ]; then
            echo "Validation was skipped (label gate closed)."
          else
            echo "Gate label found: ${{ steps.gate.outputs.gate_label_found }}"
          fi

      - name: Continue only if validated and funded
        if: steps.gate.outputs.gate_skipped != 'true' && steps.gate.outputs.account_funded == 'true'
        run: |
          echo "✓ Account is funded and ready for payout."
          echo "Trustline exists: ${{ steps.gate.outputs.trustline_exists }}"
          echo "XLM balance: ${{ steps.gate.outputs.xlm_balance }}"

      - name: Flag if validation failed
        if: steps.gate.outputs.gate_skipped != 'true' && steps.gate.outputs.account_funded != 'true'
        run: |
          echo "✗ Account is not ready. See the comment on the issue for remediation steps."

      - name: Alert if gate was skipped
        if: steps.gate.outputs.gate_skipped == 'true'
        run: |
          echo "ℹ️  Label gate was closed — wallet validation was skipped."
          echo "   Add one of these labels to run validation: ${{ github.event.inputs.gate_labels || 'bounty,needs-wallet' }}"
